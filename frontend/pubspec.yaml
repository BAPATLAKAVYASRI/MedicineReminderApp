name: mediremind
description: A Flutter app for medicine reminder with CRUD operations
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^9.5.9
  timezone: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/